<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fio & Prensa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./style.css" />
</head>

<body class="min-h-screen bg-[#EFE7D6] font-sans text-[#2A241C] antialiased">
    <div class="mx-auto max-w-[1280px] px-6 pb-12 pt-4 md:px-10">
        <header class="flex items-center justify-between border-b border-[#2A241C]/20 pb-4">
            <div class="font-display text-[2rem] font-medium leading-none text-[#1B4332]">
                Fio & Prensa
            </div>

            <nav class="hidden items-center gap-10 text-sm font-medium text-[#2A241C]/80 md:flex">
                <a href="">O oficio</a>
                <a href="">Serviços</a>
                <a href="">Peças</a>
                <a href="">Contatos</a>
            </nav>

            <button class="border border-[#1B4332] bg-[#1B4332] px-4 py-2 text-sm font-medium text-[#EFE7D6]">
                Agendar visita
            </button>

        </header>

        <main class="grid items-start gap-12 pt-16 md:grid-cols-[1.1fr_0.9fr] md:gap-16">
            <section class="max-w-[650px]">
                <h1
                    class="font-display text-[4.1rem] font-medium leading-[0.9] tracking-[-0.065em] text-[#2A241C] md:text-[6rem]">
                    Livros que se
                    seguram nas mãos
                    por geração.
                </h1>

            </section>

            <aside class="w-full max-w-[500px] justify-self-end pt-2 md:pt-3">
                <div class="divide-y divide-[#2A241C]/20 border-y border-[#2A241C]/20">
                    <div class="flex items-center gap-4 py-5">

                        <div class="h-10 w-10 shrink-0 rounded-[2px] bg-[#A9895F]">
                        </div>
                        <div>
                            <p class="font-display text-[1.1rem] font-medium leading-tight text-[#2A241C]">
                                Linho belga, cor terracota
                            </p>
                            <p class="mt-1 text-sm text-[#2A241C]/65">Lãae juta, acabamento classico</p>
                        </div>

                    </div>

                    <div class="flex items-center gap-4 py-5">

                        <div class="h-10 w-10 shrink-0 rounded-[2px] bg-[#1B4332]">
                        </div>
                        <div>
                            <p class="font-display text-[1.1rem] font-medium leading-tight text-[#2A241C]">
                                Percalx verde-musgo
                            </p>
                            <p class="mt-1 text-sm text-[#2A241C]/65">Resistente à umidade</p>
                        </div>

                    </div>

                    <div class="flex items-center gap-4 py-5">
                        <div class="h-10 w-10 shrink-0 rounded-[2px] bg-[#D1B98D]">
                        </div>
                        <div>

                        </div>
                    </div>
            </aside>
        </main>
    </div>
</body>

</html>
